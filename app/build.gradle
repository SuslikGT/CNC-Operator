plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.cnc.operator'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.cnc.operator'
        minSdk 24
        targetSdk 34
        versionCode 31
        versionName '2.0.24'
    }

    signingConfigs {
        release {
            def ksProps = new Properties()
            def ksFile = rootProject.file('keystore.properties')
            if (ksFile.exists()) {
                ksFile.withInputStream { ksProps.load(it) }
            }
            storeFile file(ksProps.getProperty('storeFile', '../cnc-release.jks'))
            storePassword ksProps.getProperty('storePassword', '')
            keyAlias ksProps.getProperty('keyAlias', 'cnc')
            keyPassword ksProps.getProperty('keyPassword', '')
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
